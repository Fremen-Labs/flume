server {
    listen 8765;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Flume-Token ${FLUME_ADMIN_TOKEN};
        proxy_set_header Connection "";
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Flume-Token ${FLUME_ADMIN_TOKEN};
        proxy_set_header Connection "";
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://gateway:8090/health;
    }
    location = /livez {
        proxy_pass http://gateway:8090/livez;
    }
    location = /readyz {
        proxy_pass http://gateway:8090/readyz;
    }
    location = /metrics {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
