server {
    listen 8765;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Gateway API + chat. Buffering off so streaming completions pass through.
    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://gateway:8090/health;
    }
    location = /livez {
        proxy_pass http://gateway:8090/livez;
    }
    location = /readyz {
        proxy_pass http://gateway:8090/readyz;
    }
    location = /metrics {
        proxy_pass http://gateway:8090/metrics;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
