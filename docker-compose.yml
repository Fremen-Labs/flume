# ─────────────────────────────────────────────────────────────────────────────
# Flume Infrastructure Services — docker-compose.yml
#
# Phase 5: Only infrastructure services (Elasticsearch, OpenBao) run as
# Docker containers. All application services (gateway, dashboard,
# worker-manager) now run in-process via the single `flume` Go binary.
#
# Usage:
#   flume start         → orchestrates this compose file + in-process services
#   flume destroy       → docker compose --profile managed_elastic down -v
# ─────────────────────────────────────────────────────────────────────────────

services:
  openbao:
    image: hashicorp/vault:1.15
    container_name: flume-openbao
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false
    command: server
    environment:
      - VAULT_API_ADDR=http://127.0.0.1:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data:/vault/file
      - ./config:/vault/config:ro
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; rc=$$?; if [ $$rc -eq 0 ] || [ $$rc -eq 2 ]; then exit 0; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: flume-elasticsearch
    profiles: ["managed_elastic"]
    environment:
      - discovery.type=single-node
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD}"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -u \"elastic:${FLUME_ELASTIC_PASSWORD}\" https://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  es_data:
  openbao_data:
