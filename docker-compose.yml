# ─────────────────────────────────────────────────────────────────────────────
# Flume core stack — OpenBao, Elasticsearch, Gateway, console
#
# Default `docker compose up` starts only these four services.
# The heavy dashboard + workers remain behind profile `full` for flume start.
#
# Usage:
#   docker compose up -d --build --wait
#   open http://localhost:8765
# ─────────────────────────────────────────────────────────────────────────────

services:
  openbao:
    image: hashicorp/vault:1.15
    container_name: flume-openbao
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN:-flume-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: flume-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u \"elastic:${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}\" http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    image: flume-gateway:stub
    container_name: flume-gateway
    depends_on:
      elasticsearch:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-flume-dev-root}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GATEWAY_PORT=8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        VITE_CORE_UI: "true"
    image: flume-frontend:core
    container_name: flume-frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8765/"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  # ── Full agent mesh (opt-in) ──────────────────────────────────────────────
  dashboard:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    container_name: flume-dashboard
    depends_on:
      elasticsearch:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL:-http://elasticsearch:9200}
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-flume-dev-root}
      - BAO_SECRET_ID=${BAO_SECRET_ID:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-}
      - FLUME_STATIC_ROOT=/app/frontend/dist
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GATEWAY_URL=http://gateway:8090
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADO_PERSONAL_ACCESS_TOKEN=${ADO_PERSONAL_ACCESS_TOKEN:-}
      - FLUME_PLANNER_TIMEOUT_SECONDS=${FLUME_PLANNER_TIMEOUT_SECONDS:-}
    ports:
      - "8766:8765"
    command: ["dashboard"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8765/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL:-http://elasticsearch:9200}
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-flume-dev-root}
      - BAO_SECRET_ID=${BAO_SECRET_ID:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GATEWAY_URL=http://gateway:8090
      - DASHBOARD_URL=http://dashboard:8765
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADO_PERSONAL_ACCESS_TOKEN=${ADO_PERSONAL_ACCESS_TOKEN:-}
      - FLUME_PLANNER_TIMEOUT_SECONDS=${FLUME_PLANNER_TIMEOUT_SECONDS:-}
    command: ["worker-manager"]
    deploy:
      replicas: ${FLUME_WORKER_COUNT:-2}

volumes:
  es_data:
