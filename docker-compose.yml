# ─────────────────────────────────────────────────────────────────────────────
# Flume Core — OpenBao, Elasticsearch, Gateway, console
#
#   docker compose up -d --build --wait
#   open http://127.0.0.1:8765
#
# Agent mesh (dashboard + workers) is opt-in: --profile full
# ─────────────────────────────────────────────────────────────────────────────

services:
  openbao:
    image: hashicorp/vault:1.15
    container_name: flume-openbao
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data:/vault/file
      - ./config:/vault/config:ro
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; rc=$$?; if [ $$rc -eq 0 ] || [ $$rc -eq 2 ]; then exit 0; else exit 1; fi"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao-init:
    image: hashicorp/vault:1.15
    container_name: flume-openbao-init
    user: "0:0"
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://openbao:8200
    volumes:
      - openbao_init:/init
      - ./scripts/openbao-init.sh:/openbao-init.sh:ro
    entrypoint: ["/bin/sh", "/openbao-init.sh"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: flume-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u \"elastic:${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}\" http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    image: flume-gateway:core
    container_name: flume-gateway
    depends_on:
      elasticsearch:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-flume-dev-admin}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GATEWAY_PORT=8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openbao_init:/openbao-init:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        VITE_CORE_UI: "true"
    image: flume-frontend:core
    container_name: flume-frontend
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-flume-dev-admin}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  dashboard:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    container_name: flume-dashboard
    depends_on:
      elasticsearch:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL:-http://elasticsearch:9200}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-flume-dev-admin}
      - FLUME_STATIC_ROOT=/app/frontend/dist
      - GATEWAY_URL=http://gateway:8090
    ports:
      - "127.0.0.1:8766:8765"
    command: ["dashboard"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8765/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL:-http://elasticsearch:9200}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD:-flume-dev-elastic}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-flume-dev-admin}
      - GATEWAY_URL=http://gateway:8090
      - DASHBOARD_URL=http://dashboard:8765
    command: ["worker-manager"]

volumes:
  es_data:
  openbao_data:
  openbao_init:
