# ─────────────────────────────────────────────────────────────────────────────
# Flume Docker Compose — Infrastructure + Application Services
#
# Infrastructure: Elasticsearch, OpenBao (always containers)
# Application:    Dashboard, Gateway (Go containers from unified Dockerfile)
# Workers:        Spawned dynamically by the orchestrator (1..N)
#
# All application services share a single Docker image built from ./Dockerfile.
# Each service uses a different CMD to run its specific subsystem.
#
# Usage:
#   flume start         → orchestrates this compose file
#   flume destroy       → docker compose --profile managed_elastic down -v
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  openbao:
    image: hashicorp/vault:1.15
    container_name: flume-openbao
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false
    command: server
    environment:
      - VAULT_API_ADDR=http://127.0.0.1:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data:/vault/file
      - ./config:/vault/config:ro
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; rc=$$?; if [ $$rc -eq 0 ] || [ $$rc -eq 2 ]; then exit 0; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: flume-elasticsearch
    profiles: ["managed_elastic"]
    environment:
      - discovery.type=single-node
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD}"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -u \"elastic:${FLUME_ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' > /dev/null || curl -k -s -u \"elastic:${FLUME_ELASTIC_PASSWORD}\" https://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services (Go binary, different entrypoints) ─────────────────

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    container_name: flume-dashboard
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false
      openbao:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL}
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - BAO_SECRET_ID=${BAO_SECRET_ID:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-}
      - FLUME_STATIC_ROOT=/app/frontend/dist
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GATEWAY_URL=http://gateway:8090
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADO_PERSONAL_ACCESS_TOKEN=${ADO_PERSONAL_ACCESS_TOKEN:-}
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    command: ["dashboard"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8765/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    container_name: flume-gateway
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false
      openbao:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL}
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - BAO_SECRET_ID=${BAO_SECRET_ID:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADO_PERSONAL_ACCESS_TOKEN=${ADO_PERSONAL_ACCESS_TOKEN:-}
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    command: ["gateway"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELASTR0_INSTALL: public
        LOGLOOM_INSTALL: public
    depends_on:
      dashboard:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      - ES_URL=${ES_URL}
      - ES_API_KEY=${ES_API_KEY:-}
      - FLUME_ELASTIC_PASSWORD=${FLUME_ELASTIC_PASSWORD}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - BAO_SECRET_ID=${BAO_SECRET_ID:-}
      - FLUME_ADMIN_TOKEN=${FLUME_ADMIN_TOKEN:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LOCAL_OLLAMA_BASE_URL=${LOCAL_OLLAMA_BASE_URL:-}
      - GATEWAY_URL=http://gateway:8090
      - DASHBOARD_URL=http://dashboard:8765
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADO_PERSONAL_ACCESS_TOKEN=${ADO_PERSONAL_ACCESS_TOKEN:-}
    command: ["worker-manager"]
    deploy:
      replicas: ${FLUME_WORKER_COUNT:-2}

volumes:
  es_data:
  openbao_data:
